# Reviewed by hand: Arcane must never install an image update on its own.
x-arcane:
  updater:
    enabled: false

services:
  convert-service:
    image: ghcr.io/fabianwimberger/archive-video-av1:latest
    container_name: convert-service
    restart: unless-stopped
    ports:
      - "8000:8000"
      # - "9988:9988/udp"
    volumes:
      - /path/to/your/videos:/videos
      - app-data:/app/data
    environment:
      - TZ=UTC

volumes:
  app-data:

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-video-av1"
version = "1.10.0"
description = "Web-based AV1 video conversion service"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.161.1",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.6",
    "aiosqlite==0.22.1",
    "python-multipart==0.0.32",
    "websockets==17.3",
    "alembic==1.20.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "mypy==2.4.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sqlalchemy.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

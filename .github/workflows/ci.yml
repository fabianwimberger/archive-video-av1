name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install ruff==0.15.22 mypy

      - name: Lint with ruff
        run: ruff check backend/ scripts/

      - name: Format check with ruff
        run: ruff format --check backend/ scripts/

      - name: Type check with mypy
        run: mypy backend/ --ignore-missing-imports

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: backend/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  docker-amd64:
    name: Docker Build (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: archive-video-av1:test-amd64
          build-args: |
            ENABLE_PGO=false
            ENABLE_LTO=false
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64
          platforms: linux/amd64
          load: true

      - name: Create sample video
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -v error -f lavfi -i testsrc2=size=160x90:rate=24 -f lavfi -i sine=frequency=440 -t 3 -c:v libx264 -c:a aac /tmp/smoke.mkv

      - name: Check startup and conversion
        run: docker run --rm -v /tmp/smoke.mkv:/sample.mkv:ro archive-video-av1:test-amd64 python3 scripts/smoke_test.py /sample.mkv

      - name: Verify license file exists
        run: docker run --rm archive-video-av1:test-amd64 cat /usr/share/licenses/FFmpeg-LICENSE

  docker-arm64:
    name: Docker Build (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: archive-video-av1:test-arm64
          build-args: |
            ENABLE_PGO=false
            ENABLE_LTO=false
          cache-from: type=gha,scope=linux-arm64
          cache-to: type=gha,mode=max,scope=linux-arm64
          platforms: linux/arm64
          load: true

      - name: Create sample video
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -v error -f lavfi -i testsrc2=size=160x90:rate=24 -f lavfi -i sine=frequency=440 -t 3 -c:v libx264 -c:a aac /tmp/smoke.mkv

      - name: Check startup and conversion
        run: docker run --rm -v /tmp/smoke.mkv:/sample.mkv:ro archive-video-av1:test-arm64 python3 scripts/smoke_test.py /sample.mkv

      - name: Verify license file exists
        run: docker run --rm archive-video-av1:test-arm64 cat /usr/share/licenses/FFmpeg-LICENSE
